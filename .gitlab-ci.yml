build-docker:
  stage: build
  image:
    name: gcr.chenby.cn/kaniko-project/executor:debug
    entrypoint: [""]
  needs: [unit-test]
  script:
    - /kaniko/executor --context . --dockerfile Dockerfile --no-push
  allow_failure: true

