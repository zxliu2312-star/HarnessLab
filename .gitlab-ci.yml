# Runner 网络仅可访问 Docker Hub，用 python:3.12-slim 模拟 Dockerfile 构建步骤
build-docker:
  stage: build
  image: python:3.12-slim
  needs: [unit-test]
  script:
    - pip install --quiet -r requirements.txt
    - python -c "import streamlit; print('streamlit import OK')"
    - python -c "import harness; print('harness import OK')"
    - python -c "import ui; print('ui import OK')"
    - python -c "import demo; print('demo import OK')"
    - echo "Dockerfile build simulation passed"
  allow_failure: true
