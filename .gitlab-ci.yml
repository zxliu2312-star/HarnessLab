stages:
  - test
  - lint
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

unit-test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r requirements.txt
  script:
    - python -m pytest tests/ -v --tb=short
  coverage: '/TOTAL.*\s+(\d+%)$/'

demo:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r requirements.txt
  script:
    - python demo/demo_mechanisms.py

lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet pyflakes
  script:
    - python -m pyflakes harness/ ui/ demo/
  allow_failure: true

# ── 方案 A（主）：docker:dind，需要 Runner 开启 privileged 模式 ──
# Runner config.toml 中 [runners.docker] 下设置 privileged = true
build-docker:
  stage: build
  image: docker:latest
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""        # 禁用 TLS，让 dockerd 监听 2375 端口
        DOCKER_DRIVER: overlay2
  variables:
    DOCKER_HOST: tcp://docker:2375    # 明确指定非 TLS 端口，与 dind 服务匹配
  needs: [unit-test]
  script:
    - docker info                     # 先验证 daemon 是否可用，便于排查
    - docker build -t coding-agent-harness .
  allow_failure: true

# ── 方案 B（备选）：Kaniko，无需 privileged 模式 ──
# 如果 Runner 无法开启 privileged，注释掉上面的 build-docker，取消注释下面的：
